name: Release
run-name: Release for Push on ${{ github.ref_name }} #${{ github.run_number }}

on:
  push:
    branches:
      - main
      - next
    paths-ignore:
      - 'CHANGELOG.md'

env:
  NEW_VERSION: ""

permissions:
  contents: read

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}
        run: |
          OUTPUT=$(npx semantic-release)
          echo "$OUTPUT"
          NEW_VERSION=$(echo "$OUTPUT" | grep "Published release" | cut -d" " -f9)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

    outputs:
      new_version: ${{ steps.semantic_release.outputs.new_version }}

  dockerhub-release:
    name: Push Image to DockerHub
    needs: github-release
    if: needs.github-release.outputs.new_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Docker Metadata (Tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            johnnyknighten/vein-server
          tags: |
            ${{ (github.ref == 'refs/heads/main') && 'type=raw,value=latest' || '' }}
            type=semver,pattern={{version}},onlatest=true,value=${{ needs.github-release.outputs.new_version }}

      - name: Push Image to DockerHub
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags:  ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Update DockerHub Description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: johnnyknighten/vein-server
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true

  sync-main-to-next:
    name: Sync main to next
    needs: github-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}

      - name: Create sync PR
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}
          branch: chore/sync-main-to-next
          base: next
          title: "chore: sync main to next"
          body: "Automated PR to sync changes from main back to next."
          delete-branch: true
