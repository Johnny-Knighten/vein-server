name: Release
run-name: Release for Push on ${{ github.ref_name }} #${{ github.run_number }}

on:
  push:
    branches:
      - main
      - next
    paths-ignore:
      - 'CHANGELOG.md'

env:
  NEW_VERSION: ""

permissions:
  contents: read

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}
        run: |
          OUTPUT=$(npx semantic-release)
          echo "$OUTPUT"
          NEW_VERSION=$(echo "$OUTPUT" | grep "Published release" | cut -d" " -f9)
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

    outputs:
      new_version: ${{ steps.semantic_release.outputs.new_version }}

  dockerhub-release:
    name: Push Image to DockerHub
    needs: github-release
    if: needs.github-release.outputs.new_version != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create Docker Metadata (Tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            johnnyknighten/vein-server
          tags: |
            ${{ (github.ref == 'refs/heads/main') && 'type=raw,value=latest' || '' }}
            type=semver,pattern={{version}},onlatest=true,value=${{ needs.github-release.outputs.new_version }}

      - name: Push Image to DockerHub
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags:  ${{ steps.meta.outputs.tags }}
          cache-from: type=gha

      - name: Update DockerHub Description
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: johnnyknighten/vein-server
          short-description: ${{ github.event.repository.description }}
          enable-url-completion: true

  sync-main-to-next:
    name: Sync main to next
    needs: github-release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync main to next via PR
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_SEMANTIC_RELEASE }}
        run: |
          set -eo pipefail

          # Fetch latest branches
          git fetch origin next main

          # Create temporary branch from main (already at main after checkout)
          BRANCH_NAME="sync-main-to-next-${{ github.run_number }}"
          git checkout -b "$BRANCH_NAME"

          # Push temporary branch (contains main's commits)
          git push origin "$BRANCH_NAME"

          # Create PR and capture PR number
          # Note: Using --admin flag to bypass branch protection rules for automated sync
          PR_URL=$(gh pr create \
            --base next \
            --head "$BRANCH_NAME" \
            --title "chore: sync main back to next [skip ci]" \
            --body "Automated sync of main branch back to next after release ${{ needs.github-release.outputs.new_version }}." \
            --repo ${{ github.repository }})

          echo "Created PR: $PR_URL"

          # Extract PR number from URL
          PR_NUMBER=$(echo "$PR_URL" | grep -o '[0-9]*$')

          # Merge PR with admin privileges to bypass branch protection
          # gh pr merge handles waiting for PR to be ready
          gh pr merge "$PR_NUMBER" \
            --merge \
            --admin \
            --delete-branch \
            --repo ${{ github.repository }}

          echo "Successfully synced main to next via PR #$PR_NUMBER"
