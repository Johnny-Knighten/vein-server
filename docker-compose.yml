# ============================================================================
# Vein Dedicated Server - Docker Compose Configuration
# ============================================================================
# This is the primary deployment method for Vein server
# For advanced configurations, see examples/ directory
# ============================================================================

services:
  vein-server:
    # -------------------------------------------------------------------------
    # Build Configuration
    # -------------------------------------------------------------------------
    build:
      context: .
      dockerfile: Dockerfile

    # -------------------------------------------------------------------------
    # Container Naming
    # -------------------------------------------------------------------------
    container_name: vein-server

    # -------------------------------------------------------------------------
    # Restart Policy
    # -------------------------------------------------------------------------
    # unless-stopped: Restart on failure, but not if manually stopped
    # This ensures server recovers from crashes but respects docker-compose down
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # Port Mappings
    # -------------------------------------------------------------------------
    # Map container ports to host ports
    # Format: "host:container/protocol"
    ports:
      - "7777:7777/udp"   # Game port (players connect here)
      - "27015:27015/udp" # Steam query port (server browser)
      # - "8080:8080/tcp" # HTTP API (future - Phase 7+)

    # -------------------------------------------------------------------------
    # Volume Mappings
    # -------------------------------------------------------------------------
    # Named volumes for data persistence
    # These survive container recreations and allow easy backups
    volumes:
      - vein-server-data:/vein-server/server     # Game files (20-30GB)
      - vein-server-logs:/vein-server/logs       # Log files
      - vein-server-backups:/vein-server/backups # Backup archives

    # -------------------------------------------------------------------------
    # Environment Variables
    # -------------------------------------------------------------------------
    # Phase 1 & 3: Core server configuration (simple ENV vars)
    # Phase 2: Update and validation settings (added below)
    # Phase 3: Advanced configuration (CONFIG_ vars, added below)
    # Phase 4: Backup settings (future)
    # Phase 5: Scheduling settings (future)
    # -------------------------------------------------------------------------
    environment:
      # -----------------------------------------------------------------------
      # Phase 1 & 3: Core Server Configuration
      # -----------------------------------------------------------------------
      # Simple environment variables (transformed to CONFIG_ in bootstrap)
      # These match Vein's Game.ini structure

      # Server Identity
      VEIN_SERVER_NAME: "Vein Server"
      VEIN_SERVER_DESCRIPTION: "A Vein dedicated server"
      VEIN_SERVER_PASSWORD: ""  # Empty = no password required
      VEIN_SERVER_PUBLIC: "True"  # Show in server browser

      # Server Capacity
      VEIN_SERVER_MAX_PLAYERS: "16"  # Default is 16

      # Network Configuration
      VEIN_SERVER_PORT: "7777"
      VEIN_SERVER_QUERY_PORT: "27015"
      VEIN_BIND_ADDR: "0.0.0.0"
      VEIN_HEARTBEAT_INTERVAL: "5.0"

      # Steam Configuration
      VEIN_VAC_ENABLED: "0"  # 0=disabled, 1=enabled

      # -----------------------------------------------------------------------
      # Phase 2: Update System Settings
      # -----------------------------------------------------------------------
      # Server directory (where SteamCMD downloads files)
      SERVER_DIR: "/vein-server/server"

      # Auto-update on container boot
      UPDATE_ON_BOOT: "True"  # True/False - Check for updates on startup

      # File validation after update
      VEIN_VALIDATE_FILES: "true"  # true/false - Verify VeinServer.sh exists

      # Manual configuration mode (skips config generation)
      MANUAL_CONFIG: "False"  # True/False - Set to True to use your own configs

      # Debug mode (enables bash -x tracing)
      DEBUG: "false"  # true/false - Enable verbose logging

      # Dry run mode (test without actually starting services)
      DRY_RUN: "False"  # True/False - For testing only

      # -----------------------------------------------------------------------
      # Phase 3: Advanced Configuration (Optional)
      # -----------------------------------------------------------------------
      # Direct CONFIG_ variables for advanced users (bypasses bootstrap transformation)
      # Format: CONFIG_Game_<section>_<variable>=<value>
      # Use SLASH for / and DOT for . in section names
      #
      # Examples (uncomment to use):
      # CONFIG_Game_SLASH_Script_SLASH_Vein_DOT_VeinGameSession_AdminSteamIDs: "76561198012345678"
      # CONFIG_Game_SLASH_Script_SLASH_Vein_DOT_VeinGameSession_SuperAdminSteamIDs: "76561198012345678"
      # CONFIG_Game_SLASH_Script_SLASH_Vein_DOT_VeinGameStateBase_WhitelistedPlayers: "76561198012345678"

    # -------------------------------------------------------------------------
    # Resource Limits (Optional - Recommended for Production)
    # -------------------------------------------------------------------------
    # Uncomment to set resource limits
    # Based on Vein server requirements: 12GB RAM, quad-core CPU
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 12G
    #     reservations:
    #       cpus: '2'
    #       memory: 8G

    # -------------------------------------------------------------------------
    # Logging Configuration
    # -------------------------------------------------------------------------
    # Limit log file size to prevent disk exhaustion
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # -------------------------------------------------------------------------
    # TTY Allocation
    # -------------------------------------------------------------------------
    # Enable TTY for proper signal handling
    tty: true
    stdin_open: true

# =============================================================================
# Named Volumes
# =============================================================================
# These volumes persist data across container lifecycles
# Located in Docker's volume directory (/var/lib/docker/volumes/)
# =============================================================================
volumes:
  vein-server-data:
    driver: local
    # Optional: Use bind mount for easier access (uncomment below)
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: ./volumes/server

  vein-server-logs:
    driver: local

  vein-server-backups:
    driver: local
    # Optional: External backup location (uncomment below)
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /path/to/external/backups
