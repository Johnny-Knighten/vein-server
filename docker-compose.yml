# ============================================================================
# Vein Dedicated Server - Docker Compose Configuration
# ============================================================================
# This is the primary deployment method for Vein server
# For advanced configurations, see examples/ directory
# ============================================================================

version: '3.8'

services:
  vein-server:
    # -------------------------------------------------------------------------
    # Build Configuration
    # -------------------------------------------------------------------------
    build:
      context: .
      dockerfile: Dockerfile

    # -------------------------------------------------------------------------
    # Container Naming
    # -------------------------------------------------------------------------
    container_name: vein-server

    # -------------------------------------------------------------------------
    # Restart Policy
    # -------------------------------------------------------------------------
    # unless-stopped: Restart on failure, but not if manually stopped
    # This ensures server recovers from crashes but respects docker-compose down
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # Port Mappings
    # -------------------------------------------------------------------------
    # Map container ports to host ports
    # Format: "host:container/protocol"
    ports:
      - "7777:7777/udp"   # Game port (players connect here)
      - "27015:27015/udp" # Steam query port (server browser)
      # - "8080:8080/tcp" # HTTP API (future - Phase 7+)

    # -------------------------------------------------------------------------
    # Volume Mappings
    # -------------------------------------------------------------------------
    # Named volumes for data persistence
    # These survive container recreations and allow easy backups
    volumes:
      - vein-server-data:/vein-server/server     # Game files (20-30GB)
      - vein-server-logs:/vein-server/logs       # Log files
      - vein-server-backups:/vein-server/backups # Backup archives

    # -------------------------------------------------------------------------
    # Environment Variables - Phase 1 MVP
    # -------------------------------------------------------------------------
    # Minimal configuration for Phase 1
    # Additional variables added in later phases:
    # - Phase 2: Update settings (VEIN_AUTO_UPDATE, etc.)
    # - Phase 3: 251+ gameplay settings
    # - Phase 4: Backup settings
    # - Phase 5: Scheduling settings
    # -------------------------------------------------------------------------
    environment:
      # Server Identity
      VEIN_SERVER_NAME: "Vein Server"
      VEIN_SERVER_PASSWORD: ""  # Empty = no password required
      VEIN_SERVER_ADMIN_PASSWORD: "changeme"  # CHANGE THIS IN PRODUCTION

      # Server Capacity
      VEIN_SERVER_MAX_PLAYERS: "32"

      # Network Ports (must match ports section above)
      VEIN_SERVER_PORT: "7777"
      VEIN_SERVER_QUERY_PORT: "27015"

    # -------------------------------------------------------------------------
    # Resource Limits (Optional - Recommended for Production)
    # -------------------------------------------------------------------------
    # Uncomment to set resource limits
    # Based on Vein server requirements: 12GB RAM, quad-core CPU
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 12G
    #     reservations:
    #       cpus: '2'
    #       memory: 8G

    # -------------------------------------------------------------------------
    # Logging Configuration
    # -------------------------------------------------------------------------
    # Limit log file size to prevent disk exhaustion
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # -------------------------------------------------------------------------
    # TTY Allocation
    # -------------------------------------------------------------------------
    # Enable TTY for proper signal handling
    tty: true
    stdin_open: true

# =============================================================================
# Named Volumes
# =============================================================================
# These volumes persist data across container lifecycles
# Located in Docker's volume directory (/var/lib/docker/volumes/)
# =============================================================================
volumes:
  vein-server-data:
    driver: local
    # Optional: Use bind mount for easier access (uncomment below)
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: ./volumes/server

  vein-server-logs:
    driver: local

  vein-server-backups:
    driver: local
    # Optional: External backup location (uncomment below)
    # driver_opts:
    #   type: none
    #   o: bind
    #   device: /path/to/external/backups
